[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = true
extra_output = ["storageLayout"]
fs_permissions = [{ access = "read", path = "./deployments" }, { access = "read-write", path = "./reports" }]
fuzz.runs = 512
invariant.runs = 256
invariant.depth = 64
invariant.fail_on_revert = true

# Real-BSC fork tests (scripts/fork-test.ts). The deployed TapeOut contracts use PUSH0, so the
# fork EVM runs at Cancun, while the test deploys the Paris artifact from ./out unchanged.
[profile.fork]
evm_version = "cancun"
out = "out-fork"
cache_path = "cache-fork"
fs_permissions = [{ access = "read", path = "./out" }, { access = "read-write", path = "./reports" }]

[fmt]
line_length = 110

[lint]
lint_on_build = false
